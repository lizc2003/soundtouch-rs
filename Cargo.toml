[package]
name = "soundtouch-rs"
version = "2.4.0"
edition = "2021"
rust-version = "1.70"
license = "LGPL-2.1"
authors = ["lizc"]
description = "SoundTouch audio processing library in Rust - pitch/tempo/rate adjustment"
repository = "https://github.com/lizc2003/soundtouch-rs"
readme = "README.md"
keywords = ["audio", "soundtouch", "pitch", "tempo", "dsp"]
categories = ["multimedia::audio", "algorithms"]

[lib]
name = "soundtouch"
path = "src/lib.rs"

[[bin]]
name = "soundstretch"
path = "src/bin/soundstretch.rs"

[dependencies]
hound = "3.5"  # WAV file I/O
thiserror = "2.0"

[dev-dependencies]

[features]
default = ["unsafe-optimizations"]
unsafe-optimizations = []  # Enable unsafe optimizations for better performance

[profile.release]
opt-level = 3           # Maximum optimization level (matches C++ -O3)
lto = "fat"             # Aggressive link-time optimization
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Reduce panic handling overhead
overflow-checks = false # Disable overflow checks (safe for audio DSP)
debug = false           # Strip all debug info
strip = true            # Strip symbols

[profile.bench]
inherits = "release"
